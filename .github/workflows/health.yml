name: LevelClose public health
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Live probe or clearly labeled synthetic notification test
        required: true
        default: live
        type: choice
        options: [live, synthetic-failure, synthetic-recovery]
permissions:
  contents: read
  issues: write
concurrency:
  group: levelclose-public-health
  cancel-in-progress: false
jobs:
  health:
    # Never reconcile incidents from a non-default branch dispatch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Test monitor boundaries
        run: node --test --experimental-test-coverage --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100 monitor.test.mjs
      - name: Observe and reconcile
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONITOR_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
        run: node monitor.mjs
